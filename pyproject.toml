[build-system]
requires = ["setuptools>=61.0", "cython", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "factorsums"
version = "0.3.0"
description = "A project for prime partition generation using SageMath and Cython."
license = "MIT"
authors = [{ name = "Eric Page", email = "genamthi@gmail.com" }]
readme = "README.md"
requires-python = "~=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pixi.pypi-options]
no-build-isolation = true

# --- Pixi Workspace and Environment Configuration ---

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "~=3.12"
sage = ">=10.6,<11"
numpy = "*"
psutil = "*"
tqdm = "*"
cython = "*"
setuptools = "*"

[tool.pixi.pypi-dependencies]
factorsums = { path = "." }

# --- Rattler-Build Packaging ---

[tool.rattler-build]
build-dependencies = [ "python", "cython", "setuptools", "numpy", "sage" ]
dependencies = [ "python", "sage", "numpy", "psutil", "tqdm" ]
